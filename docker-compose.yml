services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: playerpulser
      POSTGRES_PASSWORD: playerpulser
      POSTGRES_DB: playerpulser
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playerpulser -d playerpulser"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
